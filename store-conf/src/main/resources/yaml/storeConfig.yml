---
which-store-info: "{!ENV: MERRITT_STORE_INFO !DEFAULT: store-info-docker}"

store-info-docker: &docker
  baseURI: "http://{!ENV: SVC_STORE !DEFAULT: store:8080/store}"
  supportURI: mailto:merritt-support@ucop.edu
  verifyOnRead: true
  verifyOnWrite: true
  producerFilter:
    - mrt-erc.txt
    - mrt-eml.txt
    - mrt-dc.xml
    - mrt-delete.txt
    - mrt-dua.txt
    - mrt-dataone-manifest.txt
    - mrt-datacite.xml
    - mrt-embargo.txt
    - mrt-oaidc.xml
    - mrt-provenance.xml
    - stash-wrapper.xml
  archiveNode: 7777
  nodePath: "yaml:2"
  backOutOnException: "false"
  fileLogger:
    messageMaximumLevel: 5
    messageMaximumError: 10
    path: /dpr2store/mrtHomes/
    name: store
    qualifier: yyMMdd
    trace: 5
  queueInfo:
    QueueService: "{!ENV: ZKCONN !DEFAULT: zoo:2181}"
    QueueLargeWorker: "localhost"
    QueueSizeLimit: "600000000"
    QueueLockBase: "/mrt.lock"
    QueueHoldLock: "access/LargeAccessHold"
    QueueHoldFile: "/dpr2store/mrtHomes/AccessHold"
    QueueTimeout: "40000"
    LargeAccessHold: "access/LargeAccessHold"
    SmallAccessHold: "access/SmallAccessHold" 
    PollingInterval: "15"
    PollingIntervalStore: "20"
    NumThreadsSmall: "5"
    NumThreadsLarge: "3"
    NumThreadsStore: "{!ENV: NUM_THREADS_STORE !DEFAULT: 2}"

store-ecs-docker: 
  <<: *docker
  nodePath: "yaml:2"
  archiveNode: "{!ENV: ARCHIVE_NODE !DEFAULT: 8888}"
